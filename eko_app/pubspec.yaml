  intl: any
  flutter_svg: ^2.0.17
  qr_flutter_new: ^1.0.2
  url_launcher: ^6.3.2
  overlay_support: ^2.1.0
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  cached_network_image: ^3.2.3
  path_provider: ^2.1.2
  go_router: ^17.2.3
  shimmer: ^3.0.0
  collection: ^1.17.1
  characters: ^1.4.0
  klipy_dart: ^0.0.2
  shared_preferences: ^2.5.3
  eraser: ^3.0.0
  extended_image: ^10.0.1
  loading_indicator: ^3.1.1
  permission_handler: ^12.0.0+1
