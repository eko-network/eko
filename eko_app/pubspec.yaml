     path: ../../ecp-dart-sdk

dependency_overrides:
  webcrypto:
    git:
      url: https://github.com/google/webcrypto.dart
      ref: 0239e850839a03f5b1f6563c8486529a2b82cbdc
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1
  flutter_math_fork: ^0.7.4
dev_dependencies:
  flutter_test:
    sdk: flutter
