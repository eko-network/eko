name: eko_app
description: A new Flutter project.
publish_to: 'none'
version: 2.3.0+75
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.4.0
  cupertino_icons: ^2.0.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.17
  qr_flutter_new: ^1.0.2
  url_launcher: ^6.3.2
  overlay_support: ^2.1.0
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0
  image_picker: ^1.1.2
  image_cropper: ^14.0.0
  cached_network_image: ^4.0.7
  path_provider: ^2.1.2
  go_router: ^18.1.4
  shimmer: ^4.0.0
  collection: ^1.17.1
  crypto: ^3.0.7
  characters: ^1.4.0
  klipy_dart: ^0.0.2
  shared_preferences: ^2.5.3
  eraser: ^3.0.0
  extended_image: ^10.0.1
  loading_indicator: ^4.0.2
  permission_handler: ^13.0.2
  emoji_picker_flutter: ^4.3.0
  like_button: ^2.1.0
  flutter_expandable_fab: ^3.0.0
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  image_to_ascii: ^0.0.1
  image: ^4.5.4
  flutter_staggered_grid_view: ^0.7.0
  cross_file: ^0.3.4+2
  gallery_saver_plus: ^3.2.4
  sensors_plus: ^7.0.0
  supabase_flutter: ^2.9.1
  uuid: ^4.4.2
  unifiedpush: ^6.2.0
  unifiedpush_platform_interface: ^4.0.0
  unifiedpush_storage_shared_preferences: ^1.0.0
  flutter_local_notifications: ^23.0.3
  webcrypto: ^0.6.1
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  ecp:
    git:
      url: https://github.com/eko-network/ecp-dart-sdk.git
      ref: 0c587235e07db7343c569216bacb2422406b59a3
  # nixpkgs' sqlite3 source builder only has sqlcipher hashes up to 3.7.0
  sqlite3: '>=3.5.2 <=3.7.0'
  drift: ^2.34.4
  lucide_icons_flutter: ^4.0.3
  cupertino_interactive_keyboard: ^1.0.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.1

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.9.5
  remove_unused_localizations_keys: ^0.0.40
  riverpod_generator: ^4.0.1
  drift_dev: ^2.34.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: MartianMono
      fonts:
        - asset: fonts/martian_mono_bold.ttf
  assets:
    - images/
