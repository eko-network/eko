name: Android App Bundle
on:
  trigger:
  # push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appbundle:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The Android SDK + NDKs from the dev shell need more room than the
        # runner has free by default.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      # eko_app depends on ecp via `path: ../../ecp-dart-sdk`, so check both
      # repos out side by side.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: eko

      - name: Check out ecp-dart-sdk
        uses: actions/checkout@v4
        with:
          repository: eko-network/ecp-dart-sdk
          path: ecp-dart-sdk

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Gradle and pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: android-${{ runner.os }}-${{ hashFiles('eko/eko_app/pubspec.lock', 'eko/eko_app/android/**/*.gradle.kts', 'eko/eko_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-${{ runner.os }}-

      - name: Set up signing
        working-directory: eko
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; exit 1; fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          cat > eko_app/android/key.properties <<PROPS
          storeFile=$keystore
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          PROPS

      - name: Build app bundle
        working-directory: eko/eko_app
        run: nix develop ..#android --command flutter build appbundle --release

      - name: Verify signature
        working-directory: eko/eko_app
        # jarsigner exits 0 for unsigned jars, so check its output instead.
        run: |
          nix develop ..#android --command jarsigner -verify build/app/outputs/bundle/release/app-release.aab \
            | tee /dev/stderr | grep -q '^jar verified'
